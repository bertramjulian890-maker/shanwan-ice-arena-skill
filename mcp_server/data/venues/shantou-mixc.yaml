faq:
  items:
    - q: 单次票能滑多久？包含清冰吗？
      a: 单次票时长含清冰时间，含两次免费进出，超时按每半小时10元收取超时费，购票当日有效。具体票价以当期货盘为准，如果你告诉我想什么时候来、是否需要陪同，我可以直接把当前在售的门票价和门店入口发你。
    - q: 陪同票怎么用？
      a: 陪同票限1.2米以下儿童的家长使用，持陪同票不可上冰；每张单次滑冰票限购一张陪同票，当日有效。具体陪同票价请看当期货盘，我也可以一起把门店入口和到店信息发你。
    - q: 私教和课程包多少钱？
      a: 我们有单次私教体验课和正式课程包两类，具体价格以当期货盘为准（不同渠道可能有团购/直播价差异）。如果你告诉我是想先体验还是长期系统学，我可以把当前在售价和报名/预约入口一并发你。
    - q: 储物柜收费吗？
      a: 场馆提供免费储物柜（以现场实际为准）。
    - q: 冰场有什么设施？
      a: 含免费储物柜、休息区、卫生间、无烟环境；可预订场地；全年开放；有免费WiFi与充电宝；停车为付费停车。
    - q: 你们教什么课？用什么体系？
      a: 汕头冰场开设花样滑冰与冰球等课程；采用 ISI 教学体系，并融入 ISU 标准；教学为阶梯式设级，兼顾正规教学与娱乐体验。具体分班与级别以现场为准。如果你想了解适合新手的课或直接报名，我可以继续给你课程入口。
    - q: 门店地址和电话是多少？
      a: 地址：汕头市长平路与金环路交界汕头万象城L556（约5楼滑冰场区域，以商场指引为准）。咨询电话：0754-8899 2291。如果你需要，我也可以直接把当前可用的门店入口发你，方便查看和到店。
    - q: 门店页面上地址怎么写？
      a: 名称一般为「冰纷万象滑冰场」；对外可简写「汕头万象城 L556」；完整地址为汕头市长平路与金环路交界汕头万象城L556。不同渠道可能仍显示「长平东路万象城5楼」类表述，以最新公示为准。


  coaches:
    - name: 原雪
      category: 冰球教练资料
      introduction: 经历：原国家女子冰球队队长，2006-2008哈尔滨中专女子冰球队，2008-2010年国家青年女子冰球队，2010年入选国家女子冰球队，2013-2017年哈尔滨体育学院，曾多次出访加拿大学习交流冰球文化知识。运动成绩：全国女子冰球锦标赛第一名，第十二届冬运会第一名，大学生冬季运动会第一名，国青冰球邀请赛（意大利）第二名，大学生冬季运动会第一名，亚洲杯四国邀请赛第二名，第十三届冬运会第一名，U18世界女子冰球锦标赛第三名，女子冰球交流赛（加拿大）第二名，俄罗斯索契交流赛第一名。技能荣誉：2011年荣获国家级运动健将，曾多次获得最佳运动员、最佳射手、最佳前锋、最具有潜力球员，曾担任中国女子冰球队队长，曾多次获得国际比赛奖项。工作经历：2015-2017年天津全明星俱乐部担任 TIGER 队主教练，2017-2020年曾被浙江队聘请参加队伍训练及比赛，期间多次获得优异比赛成绩，2020-2022年大连冠军滑冰场担任雪狼队主教练，2022-2023年担任辽宁省冰球队主教练、辽宁省青少年冰球队主教练。
    - name: 丛连庆
      category: 冰球教练资料
      introduction: 经历：原国家男子青年冰球队队员，2009年入选齐齐哈尔市少年队，2012年入选国家男子青年队，2015年入选齐齐哈尔市专业队，曾多次参加加拿大、美国等集训比赛。运动成绩：全国男子冰球锦标赛第一名，全国冬季运动会男子冰球第一名，第十二届冬运会男子冰球第一名，世界男子青年冰球锦标赛第一名，第十三届冬季运动会男子冰球锦标赛第二名，全国冰球十佳运动员，赴美国国际冰球邀请赛第三名，俄罗斯冰球邀请赛第一名。技能荣誉：国际冰联一级教练员、国际E级冰球教练员，曾多次获得最佳运动员、最佳前锋、最佳射手，曾多次获得国内优秀教练员奖项及证书。工作经历：2017-2019年大连冠军冰场腾龙队 U6/U8 主教练，2019-2021年大连星耀冰场星之队 U8/U10 主教练，2022年大连冠军冰场雪狼队主教练，2023年担任辽宁省冰球队主教练、辽宁省青少年冰球队主教练。
    - name: 高羲
      category: 特邀花滑教练资料
      introduction: 国家健将级运动员，前国家队队员，20年滑冰教学经验。执教经历：2000年1月-2000年8月北京世纪星滑冰俱乐部，2000年10月-2002年执教于新加坡，2003年-2007年北京西单滑冰场执教，2008年-2009年深圳海岸城滑冰俱乐执教，2009年-2012年深圳全明星滑冰俱乐部（培训部主管），2012年-2016年深圳冰纷万象滑冰场执教，2016年至今深圳奥之星冰上运动咨询有限公司。荣誉经历：全国青年锦标赛冠军，黑龙江省男子单人滑运动员，1991年-1999年多次参加全国锦标赛和全国冠军赛，1997年全国冠军赛第五名，1998年全国冠军赛第五名，1999年全国冠军赛表演节目铜牌，2015年-2019年执教学员连续五届蝉联亚洲青少年花样滑冰挑战赛冠军。
    - name: 范茹
      category: 特邀花滑教练资料

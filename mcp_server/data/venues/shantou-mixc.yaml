venue_id: shantou-mixc
display_name: 冰纷万象滑冰场

overview:
  official_name: 冰纷万象滑冰场
  tagline: 城市中心的室内真冰场（汕头万象城店）
  summary: 汕头冰场（万象城店）冰面面积约 1200 平方米，为粤东奥林匹克标准真冰场，提供滑冰体验、花样滑冰与冰球等课程及私教；采用 ISI 教学体系并融入 ISU 标准，阶梯式设级，兼顾正规教学与娱乐体验，并持续开展冰球赛、花样滑冰汇演等冰上活动及等级测试。
  consumer_guide:
    - 首次体验可先购买单次票，确认时长与陪同规则后再考虑课程包或私教。
    - 报名课程前请阅读安全须知；上冰须全程佩戴护具。
    - 如已确定想体验、约私教或咨询办卡，可直接使用当前提供的门店页入口联系或报名。
  compliance_note:
    - 工具返回的是经营侧公开信息；涉及合同、发票、退款进度等以现场与官方渠道为准。

